<style>
/* Layout: comic page. Tag line and outlined title, one big panel that plays, four small panels that jump to a chapter, then a boxed field guide. Single light look, committed on purpose. */
:root{
  --paper:#e3eedc;
  --ink:#13201a;
  --orange:#ff8a3d;
  --leaf:#4cb86b;
  --sky:#8fc7e8;
  --white:#fbfdf8;
  --chunk:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:radial-gradient(rgba(19,32,26,.1) 1.3px,transparent 1.6px);
  background-size:11px 11px;
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.65;
  padding-inline:16px;
  padding-block:28px 56px;
}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:32px}
.head{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.kicker{margin:0;background:var(--ink);color:var(--white);font-family:var(--mono);font-size:12px;letter-spacing:.14em;padding:3px 10px}
h1{
  margin:0;font-family:var(--chunk);font-weight:400;
  font-size:clamp(3.6rem,14vw,6.4rem);line-height:1;letter-spacing:.05em;
  color:var(--orange);
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--ink);
  transform:rotate(1.5deg);transform-origin:left bottom;
}
.latin{margin:0;font-family:var(--mono);font-size:14px;font-weight:500;color:#2f8a4c;letter-spacing:.06em}

.film{display:flex;flex-direction:column;gap:18px;min-width:0}
.stage{
  position:relative;width:100%;aspect-ratio:16/10;
  background:var(--sky);
  border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
}
canvas.main{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{
  position:absolute;left:12px;top:12px;max-width:min(72%,26em);
  background:#ffe27a;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:6px 12px;display:flex;flex-direction:column;gap:0;pointer-events:none;
}
.cap b{font-family:var(--chunk);font-weight:400;font-size:1.2rem;letter-spacing:.14em;line-height:1.3}
.cap span{font-size:13.5px;line-height:1.5}
.gauge{
  position:absolute;right:12px;bottom:12px;
  background:var(--white);border:2px solid var(--ink);padding:1px 8px;
  font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}

.ctl{display:flex;align-items:center;gap:12px;min-width:0;margin-top:2px}
.ctl button{
  flex:none;min-width:68px;
  font:inherit;font-size:14px;font-weight:500;color:var(--ink);
  background:var(--white);border:3px solid var(--ink);border-radius:0;
  box-shadow:3px 3px 0 var(--ink);padding:4px 12px;cursor:pointer;
}
.ctl button:hover{background:#ffe27a}
.ctl button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--orange)}
.clock{flex:none;font-family:var(--mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

.chapters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.chapters button{
  font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  background:var(--white);border:3px solid var(--ink);border-radius:0;
  box-shadow:4px 4px 0 var(--ink);padding:0;display:flex;flex-direction:column;min-width:0;
}
.chapters button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.chapters canvas{display:block;width:100%;aspect-ratio:4/3;border-bottom:3px solid var(--ink);background:var(--sky)}
.chapters .lab{display:flex;align-items:baseline;gap:8px;padding:4px 10px 5px}
.chapters .lab b{font-family:var(--chunk);font-weight:400;font-size:1.1rem;letter-spacing:.12em}
.chapters .lab small{font-family:var(--mono);font-size:11px;font-weight:500}
.chapters button[aria-current=true] .lab{background:#ffe27a}
.chapters button[aria-current=true]{box-shadow:4px 4px 0 var(--orange)}

.guide{display:flex;flex-direction:column;gap:16px;background:var(--white);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 18px 16px}
.guide h2{margin:0;font-family:var(--chunk);font-weight:400;font-size:1.6rem;letter-spacing:.14em;line-height:1.2}
dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.row{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:12px;padding:10px 0;border-top:2px dashed rgba(19,32,26,.3);align-items:start}
dt{justify-self:start;background:#b9e6a8;border:2px solid var(--ink);padding:0 6px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em}
dd{margin:0;min-width:0}
.note{margin:0;font-family:var(--mono);font-size:12px}
.sfxload{position:absolute;left:-9999px;top:0;font-family:var(--chunk);white-space:nowrap}

@media (max-width:640px){
  .stage{aspect-ratio:4/5}
  .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}
  dl{grid-template-columns:1fr}
}
</style>

<main class="wrap">
  <header class="head">
    <p class="kicker">苔藓林生物图鉴 · 第 2 话 · 虚构物种</p>
    <h1>伞耳獾</h1>
    <p class="latin">Umbrotis fungifera</p>
  </header>

  <section class="film" aria-label="伞耳獾漫画短片">
    <div class="stage">
      <canvas class="main" id="c" role="img" aria-label="漫画风格动画：一只背上长蘑菇、耳朵像叶子的小兽在林间行走，下雨时把耳朵撑开当伞"></canvas>
      <div class="cap"><b id="capName">林间</b><span id="capText"></span></div>
      <div class="gauge" id="gauge">雨量 0 mm/h</div>
    </div>
    <div class="ctl">
      <button id="play" type="button">暂停</button>
      <input id="seek" type="range" min="0" max="25" step="0.01" value="0" aria-label="播放进度">
      <span class="clock" id="clock">00:00 / 00:25</span>
    </div>
    <nav class="chapters" id="chapters" aria-label="章节"></nav>
  </section>

  <section class="guide">
    <h2>物种档案</h2>
    <dl>
      <div class="row"><dt>体长</dt><dd>0.9 米，体重约 14 公斤</dd></div>
      <div class="row"><dt>栖息</dt><dd>潮湿的苔藓林，白天在林下走动，傍晚回树洞</dd></div>
      <div class="row"><dt>伞耳</dt><dd>遇雨会撑开，张开后直径约 1.2 米，不下雨时折在脑后</dd></div>
      <div class="row"><dt>食性</dt><dd>落叶下的蕈类和蜗牛</dd></div>
      <div class="row"><dt>背菇</dt><dd>雨天停步时喷出发光孢子，孢子落地一夜就长成幼苗</dd></div>
      <div class="row"><dt>习性</dt><dd>走路时前后脚交替着地，下雨就站定不动，把腿也缩进伞下</dd></div>
    </dl>
    <p class="note">物种与拉丁名都是虚构的。点上面的小格可以跳到对应章节。</p>
  </section>
  <span class="sfxload" aria-hidden="true">踏啪嗒哗啦噗冒～！—</span>
</main>

<script>
(function(){
  var DUR=25;
  var INK='#13201a';
  var SFXFONT='"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif';
  var scenes=[
    {t:0,key:3.5,name:'林间',text:'林子刚亮，它背着蘑菇，踩着苔藓慢慢走。'},
    {t:6,key:7.6,name:'落雨',text:'雨点打下来，叶子一样的大耳朵一下子撑开成了伞。'},
    {t:12,key:13.4,name:'撒孢',text:'它停在原地，背上的蘑菇噗地喷出一团发光孢子，落地就冒出嫩芽。'},
    {t:19,key:21.5,name:'回洞',text:'雨停了，天边发红，它收起耳朵，朝树洞一路小跑。'}
  ];
  var cv=document.getElementById('c');
  var mctx=cv.getContext('2d');
  var ctx=mctx;
  var W=800,H=500,dpr=1;
  var playing=true,t=0,last=0,loops=0,sceneIdx=-1;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){playing=false;t=7.8;}

  var clamp=function(x,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,x));};
  var sm=function(a,b,x){x=clamp((x-a)/(b-a));return x*x*(3-2*x);};
  var lerp=function(a,b,k){return a+(b-a)*k;};
  var frac=function(v){return ((v%1)+1)%1;};
  function mixc(a,b,k){return [Math.round(lerp(a[0],b[0],k)),Math.round(lerp(a[1],b[1],k)),Math.round(lerp(a[2],b[2],k))];}
  function rgb(a,al){return al===undefined?'rgb('+a.join(',')+')':'rgba('+a.join(',')+','+al+')';}
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var q=Math.imul(seed^seed>>>15,1|seed);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};}

  var C={dawn:[255,214,150],rain:[104,128,156],sunset:[255,148,92]};
  var R=rng(21);
  var trees=[];for(var i=0;i<9;i++)trees.push({b:i/9+R()*0.05,h:0.3+R()*0.2,w:0.8+R()*0.5});
  var bushes=[];for(i=0;i<7;i++)bushes.push({b:i/7+R()*0.06,r:0.05+R()*0.04});
  var tufts=[];for(i=0;i<14;i++)tufts.push({b:i/14+R()*0.03,h:0.5+R()*0.6});
  var clouds=[];for(i=0;i<6;i++)clouds.push({b:i/6+R()*0.08,y:0.08+R()*0.22,r:0.035+R()*0.03});
  var SPROUT_OFF=[-0.14,-0.08,-0.02,0.04,0.1,0.16,0.22,0.29];

  // ---- how far the world has scrolled (in screen widths) ----
  function spd(tt){
    if(tt<6)return 0.055;
    if(tt<8)return lerp(0.055,0.04,(tt-6)/2);
    if(tt<11.5)return 0.04;
    if(tt<12.5)return lerp(0.04,0,tt-11.5);
    if(tt<19)return 0;
    if(tt<20)return lerp(0,0.1,tt-19);
    if(tt<24)return 0.1;
    return lerp(0.1,0.04,tt-24);
  }
  var XT=[],STEP=0.04;
  (function(){var x=0;for(var k=0;k*STEP<=DUR+0.001;k++){XT.push(x);x+=spd(k*STEP)*STEP;}})();

  function halftone(x0,y0,w,h,sp,col,rmax,flip){
    ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();
    ctx.fillStyle=col;ctx.beginPath();
    var row=0;
    for(var y=y0;y<y0+h+sp;y+=sp*0.866,row++){
      var f=clamp((y-y0)/h);if(flip)f=1-f;
      var r=rmax*Math.pow(f,0.9);if(r<0.5)continue;
      for(var x=x0+(row%2?sp/2:0);x<x0+w+sp;x+=sp){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,6.283);}
    }
    ctx.fill();ctx.restore();
  }
  function burst(x,y,r1,r2,n,rot){
    ctx.beginPath();
    for(var i=0;i<n*2;i++){
      var rr=i%2?r1:r2,a=rot+i*Math.PI/n;
      if(i===0)ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);else ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    }
    ctx.closePath();
  }
  function lens(a,b){
    ctx.beginPath();ctx.moveTo(-a,0);ctx.quadraticCurveTo(0,-b*1.7,a,0);ctx.quadraticCurveTo(0,b*1.7,-a,0);ctx.closePath();
  }

  function creature(tt,s,U,walk,phase,pulse){
    var OL=Math.max(2,2.6*s)/s;
    ctx.lineJoin='round';ctx.lineCap='round';
    var FUR='#b9825a',FURD='#8f5f3e',BELLY='#f2d9a8';
    var legX=[-34,-16,16,34];
    function leg(i,far){
      var ph=phase+((i===0||i===3)?0:Math.PI);
      var hx=legX[i],hy=-22;
      var fx=hx+Math.sin(ph)*11*walk,fy=-Math.max(0,Math.cos(ph))*7*walk;
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(fx,fy-5);
      ctx.strokeStyle=INK;ctx.lineWidth=12+OL*2;ctx.stroke();
      ctx.strokeStyle=far?FURD:FUR;ctx.lineWidth=12;ctx.stroke();
      ctx.beginPath();ctx.ellipse(fx+3,fy-4,9,4.5,0,0,6.283);
      ctx.fillStyle=far?'#6f4a30':FURD;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=OL*0.8;ctx.stroke();
    }
    leg(0,true);leg(2,true);
    // tail
    ctx.save();ctx.translate(-56,-36);ctx.rotate(-0.5+Math.sin(tt*5)*0.3);
    ctx.beginPath();ctx.ellipse(-8,0,13,8,0,0,6.283);ctx.fillStyle=FUR;ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=OL;ctx.stroke();ctx.restore();
    // body
    function bodyPath(){
      ctx.beginPath();ctx.moveTo(-56,-30);
      ctx.bezierCurveTo(-58,-72,14,-84,48,-62);
      ctx.bezierCurveTo(66,-50,62,-18,40,-12);
      ctx.bezierCurveTo(10,-4,-50,-6,-56,-30);ctx.closePath();
    }
    ctx.save();
    bodyPath();ctx.fillStyle=FUR;ctx.fill();ctx.clip();
    ctx.fillStyle=BELLY;
    ctx.beginPath();ctx.moveTo(-60,-26);ctx.quadraticCurveTo(0,-34,70,-34);ctx.lineTo(70,10);ctx.lineTo(-60,10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d9b57a';ctx.beginPath();
    for(var yd=-26,rw=0;yd<-10;yd+=5,rw++){
      var rd=2*(yd+30)/20;
      for(var xd=(rw%2?-48:-52);xd<66;xd+=8){ctx.moveTo(xd+rd,yd);ctx.arc(xd,yd,rd,0,6.283);}
    }
    ctx.fill();
    ctx.fillStyle=FURD;
    ctx.beginPath();ctx.moveTo(-60,-72);ctx.quadraticCurveTo(-34,-44,-60,-18);ctx.lineTo(-70,-18);ctx.lineTo(-70,-72);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#e0a982';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(-30,-71);ctx.bezierCurveTo(-10,-79,14,-79,34,-67);ctx.stroke();
    ctx.restore();
    bodyPath();ctx.strokeStyle=INK;ctx.lineWidth=OL;ctx.stroke();
    // head
    ctx.beginPath();ctx.arc(62,-46,21,0,6.283);ctx.fillStyle=FUR;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=OL;ctx.stroke();
    ctx.beginPath();ctx.ellipse(80,-41,13,10,0,0,6.283);ctx.fillStyle=BELLY;ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(90,-45,4.6,3.6,0,0,6.283);ctx.fillStyle=INK;ctx.fill();
    ctx.beginPath();ctx.arc(72,-37,4.6,0,6.283);ctx.fillStyle='rgba(255,130,120,0.8)';ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=OL*0.6;
    ctx.beginPath();ctx.moveTo(82,-34);ctx.quadraticCurveTo(87,-30,92,-35);ctx.stroke();
    // eye (blinks now and then)
    if(frac(tt/4.1)<0.03){
      ctx.lineWidth=OL*0.8;ctx.beginPath();ctx.moveTo(60,-52);ctx.quadraticCurveTo(66,-48,72,-52);ctx.stroke();
    }else{
      ctx.beginPath();ctx.ellipse(66,-52,6.6,7.4,0,0,6.283);ctx.fillStyle='#fbfdf8';ctx.fill();
      ctx.strokeStyle=INK;ctx.lineWidth=OL*0.8;ctx.stroke();
      ctx.beginPath();ctx.arc(68,-52,3.9,0,6.283);ctx.fillStyle=INK;ctx.fill();
      ctx.beginPath();ctx.arc(69.4,-53.6,1.4,0,6.283);ctx.fillStyle='#fbfdf8';ctx.fill();
    }
    // mushroom, leaf ear
    function mushroom(){
      ctx.save();ctx.translate(-10,-74);ctx.scale(1+0.16*pulse,1-0.24*pulse);
      ctx.beginPath();ctx.rect(-4,-16,8,17);ctx.fillStyle='#f6e7c8';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=OL*0.8;ctx.stroke();
      ctx.beginPath();ctx.ellipse(0,-16,21,15,0,Math.PI,6.283);ctx.closePath();
      ctx.fillStyle='#ff5a4e';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=OL;ctx.stroke();
      ctx.fillStyle='#fff6ea';
      ctx.beginPath();ctx.arc(-9,-22,3.2,0,6.283);ctx.fill();
      ctx.beginPath();ctx.arc(2,-28,2.8,0,6.283);ctx.fill();
      ctx.beginPath();ctx.arc(10,-21,2.4,0,6.283);ctx.fill();
      ctx.restore();
    }
    function ear(){
      var cxl=lerp(22,0,U),cyl=lerp(-72,-110,U),a=lerp(28,84,U),b=lerp(9,17,U),th=lerp(-0.15,0,U)+Math.sin(tt*3)*0.02;
      ctx.beginPath();ctx.moveTo(50,-64);
      ctx.quadraticCurveTo(lerp(50,cxl,0.25),lerp(-64,cyl,0.25)-14*U,cxl,cyl);
      ctx.strokeStyle=INK;ctx.lineWidth=OL*1.9;ctx.stroke();
      ctx.strokeStyle='#2f8a4c';ctx.lineWidth=OL*0.8;ctx.stroke();
      ctx.save();ctx.translate(cxl,cyl);ctx.rotate(th);
      lens(a,b);ctx.fillStyle='#4cb86b';ctx.fill();
      ctx.strokeStyle=INK;ctx.lineWidth=OL;ctx.stroke();
      ctx.strokeStyle='#2f8a4c';ctx.lineWidth=OL*0.6;
      ctx.beginPath();ctx.moveTo(-a*0.9,0);ctx.lineTo(a*0.9,0);
      var ks=[-0.55,-0.2,0.15,0.5];
      for(var q=0;q<ks.length;q++){
        var vx=a*ks[q],vy=b*0.75*(1-Math.abs(ks[q])*0.7);
        ctx.moveTo(vx,0);ctx.lineTo(vx+a*0.13,-vy);ctx.moveTo(vx,0);ctx.lineTo(vx+a*0.13,vy);
      }
      ctx.stroke();
      ctx.restore();
    }
    if(U>0.5){mushroom();ear();}else{ear();mushroom();}
    leg(1,false);leg(3,false);
  }

  function popv(tt,a,b){
    if(tt<a||tt>b)return 0;
    var age=tt-a,v=1;
    if(age<0.22){var x=age/0.22,c1=1.70158,c3=c1+1;v=1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
    if(b-tt<0.2)v*=(b-tt)/0.2;
    return Math.max(0,v);
  }
  function sfx(txt,x,y,size,rot,fill,pop){
    if(pop<=0)return;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(pop,pop);
    ctx.font='900 '+size+'px '+SFXFONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineWidth=size*0.22;ctx.strokeStyle=INK;ctx.strokeText(txt,0,0);
    ctx.fillStyle=fill;ctx.fillText(txt,0,0);
    ctx.restore();
  }
  function sprout(x,y,g,s,k){
    if(g<=0)return;
    var sc=Math.max(0.8,s*0.9),h=36*sc*g;
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+5*sc*k,y-h*0.5,x,y-h);
    ctx.strokeStyle=INK;ctx.lineWidth=5.2*sc;ctx.stroke();
    ctx.strokeStyle='#5fd16f';ctx.lineWidth=2.6*sc;ctx.stroke();
    var sides=[-1,1];
    for(var i=0;i<2;i++){
      ctx.save();ctx.translate(x+sides[i]*7*sc*g,y-h*0.8);ctx.rotate(sides[i]*0.6);
      lens(10*sc*g,4*sc*g);ctx.fillStyle='#8be37a';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.stroke();
      ctx.restore();
    }
    if(g>0.8){
      burst(x,y-h-3*sc,4*sc,9*sc,6,k);ctx.fillStyle='#fff2a8';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.stroke();
      ctx.beginPath();ctx.arc(x,y-h-3*sc,3*sc,0,6.283);ctx.fillStyle='#ffd23f';ctx.fill();
    }
  }

  function scene(tt,live){
    var s=Math.min(W/(W<H?400:480),H/260);
    var cx=W*0.4,gy=H*0.8;
    var xu=XU(tt);
    var wet=sm(5.6,6.6,tt)*(1-sm(16,18,tt));
    var sunk=sm(16.5,18.8,tt);
    var U=sm(6.1,7.1,tt)*(1-sm(17.8,18.6,tt));
    var sv=spd(tt),walk=clamp(sv/0.05,0,1);
    var phase=2*Math.PI*xu*W/(40*s);
    var base=Math.min(W,H*1.4)*0.1;
    var sp=clamp(W/900,0.75,1.25)*12;
    function wxc(c){return mixc(mixc(c,[90,110,125],wet*0.55),[255,140,80],sunk*0.3);}
    var i,x,y;

    // sky
    var sky=mixc(mixc(C.dawn,C.rain,sm(5.6,7,tt)),C.sunset,sunk);
    ctx.fillStyle=rgb(sky);ctx.fillRect(0,0,W,H);
    halftone(0,0,W,gy,sp,rgb(mixc(sky,[19,32,60],0.2)),sp*0.5,true);
    // sun
    var sunx=W*lerp(0.78,0.84,sunk),suny=H*lerp(0.26,0.5,sunk),sr=base*0.8*lerp(1,1.3,sunk);
    ctx.globalAlpha=1-wet*0.92;
    burst(sunx,suny,sr*1.25,sr*1.75,14,tt*0.1);ctx.fillStyle='rgba(255,246,190,0.55)';ctx.fill();
    ctx.beginPath();ctx.arc(sunx,suny,sr,0,6.283);
    ctx.fillStyle=sunk>0.3?'#ffb060':'#fff0a0';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();
    ctx.globalAlpha=1;
    // clouds
    ctx.lineJoin='round';
    var cc=mixc([251,253,248],[150,165,185],wet);
    for(i=0;i<clouds.length;i++){
      var cl=clouds[i];
      var ccx=(frac(cl.b-xu*0.05-tt*0.003)*1.3-0.15)*W,ccy=cl.y*H,cr=cl.r*Math.min(W,H*1.6)*(1+wet*0.3);
      ctx.beginPath();
      ctx.arc(ccx,ccy,cr,Math.PI,0);ctx.arc(ccx+cr*1.2,ccy-cr*0.1,cr*0.8,Math.PI*1.1,Math.PI*1.95);
      ctx.arc(ccx-cr*1.2,ccy,cr*0.7,Math.PI*1.05,Math.PI*1.9);
      ctx.lineTo(ccx-cr*1.6,ccy+cr*0.1);ctx.closePath();
      ctx.fillStyle=rgb(wxc(cc));ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2.4;ctx.stroke();
    }
    // far hills
    ctx.beginPath();ctx.moveTo(0,gy);
    for(x=0;x<=W+W/24;x+=W/24){
      var hy=gy-H*0.17-H*0.05*Math.sin((x/W+xu*0.1)*7.5)-H*0.03*Math.sin((x/W+xu*0.1)*17);
      ctx.lineTo(x,hy);
    }
    ctx.lineTo(W,gy);ctx.closePath();ctx.fillStyle=rgb(wxc([128,172,160]));ctx.fill();
    // mid trees
    for(i=0;i<trees.length;i++){
      var tr=trees[i],tx=(frac(tr.b-xu*0.3)*1.3-0.15)*W,th=tr.h*H,tw=0.016*W*tr.w,cr2=0.062*W*tr.w;
      ctx.fillStyle=rgb(wxc([116,84,62]));
      ctx.fillRect(tx-tw/2,gy-th,tw,th);ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.strokeRect(tx-tw/2,gy-th,tw,th);
      var cg=rgb(wxc([62,150,98]));
      var offs=[[0,-th],[-cr2*0.7,-th+cr2*0.6],[cr2*0.7,-th+cr2*0.6]];
      for(var q=0;q<3;q++){
        ctx.beginPath();ctx.arc(tx+offs[q][0],gy+offs[q][1],cr2,0,6.283);ctx.fillStyle=cg;ctx.fill();ctx.stroke();
      }
    }
    // ground
    ctx.fillStyle=rgb(wxc([92,168,100]));ctx.fillRect(0,gy,W,H-gy);
    halftone(0,gy,W,H-gy,sp,rgb(wxc([40,104,70])),sp*0.62,false);
    ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
    // home: a hollow tree that scrolls in near the end
    var hx=(XT[Math.round(23.5/STEP)]+0.78-xu)*W;
    if(hx-W*0.12<W&&hx+W*0.12>0){
      var hw=W*0.16,htop=H*0.06;
      ctx.fillStyle=rgb(wxc([138,90,58]));ctx.fillRect(hx-hw/2,htop,hw,gy-htop);
      ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.strokeRect(hx-hw/2,htop,hw,gy-htop);
      ctx.strokeStyle='rgba(19,32,26,0.4)';ctx.lineWidth=2;
      ctx.beginPath();
      for(i=1;i<5;i++){ctx.moveTo(hx-hw/2+hw*i/5,htop+H*0.1*(i%2));ctx.lineTo(hx-hw/2+hw*i/5,gy-H*0.1-H*0.05*(i%3));}
      ctx.stroke();
      ctx.fillStyle=rgb(wxc([48,128,84]));
      var hc=[[0,htop],[-hw*0.5,htop+hw*0.15],[hw*0.5,htop+hw*0.15]];
      for(i=0;i<3;i++){ctx.beginPath();ctx.arc(hx+hc[i][0],hc[i][1],hw*0.5,0,6.283);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();}
      var aw=hw*0.46,ah=H*0.2;
      ctx.beginPath();ctx.moveTo(hx-aw/2,gy);ctx.lineTo(hx-aw/2,gy-ah);ctx.arc(hx,gy-ah,aw/2,Math.PI,0);ctx.lineTo(hx+aw/2,gy);ctx.closePath();
      ctx.fillStyle='#2a1a12';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.stroke();
      var iw=aw*0.62,ih=ah*0.72;
      ctx.beginPath();ctx.moveTo(hx-iw/2,gy);ctx.lineTo(hx-iw/2,gy-ih);ctx.arc(hx,gy-ih,iw/2,Math.PI,0);ctx.lineTo(hx+iw/2,gy);ctx.closePath();
      ctx.fillStyle='#ffd36b';ctx.fill();
    }
    // near bushes and grass
    for(i=0;i<bushes.length;i++){
      var bs=bushes[i],bx=(frac(bs.b-xu*0.65)*1.3-0.15)*W,br=bs.r*W;
      ctx.beginPath();ctx.arc(bx,gy+2,br,Math.PI,0);ctx.closePath();
      ctx.fillStyle=rgb(wxc([54,138,86]));ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();
    }
    for(i=0;i<tufts.length;i++){
      var tf=tufts[i],tfx=(frac(tf.b-xu)*1.3-0.15)*W,tfy=gy+H*(0.05+0.1*((i*7)%5)/5),bw=7*Math.max(0.8,s*0.7)*tf.h;
      ctx.beginPath();ctx.moveTo(tfx-bw,tfy);ctx.lineTo(tfx-bw*0.4,tfy-bw*2.2);ctx.lineTo(tfx,tfy);ctx.lineTo(tfx+bw*0.5,tfy-bw*2.8);ctx.lineTo(tfx+bw,tfy);ctx.closePath();
      ctx.fillStyle=rgb(wxc([70,150,84]));ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
    }
    // sprouts from the spores
    var sbase=XT[Math.round(12/STEP)]+0.4;
    for(i=0;i<SPROUT_OFF.length;i++){
      var gs=sm(13.5+i*0.45,14.7+i*0.45,tt);
      sprout((sbase+SPROUT_OFF[i]-xu)*W,gy+H*(0.045+0.03*(i%3)),gs,s,i%2?1:-1);
    }

    // the creature
    var bob=Math.abs(Math.sin(phase))*2.5*walk+Math.sin(tt*2)*0.8;
    var pulse=0,evs=[12.4,13.6,14.8,16];
    for(i=0;i<evs.length;i++){var ev=tt-evs[i];if(ev>0&&ev<0.5)pulse=Math.max(pulse,Math.sin(ev/0.5*Math.PI));}
    ctx.save();ctx.translate(cx,gy-bob*s);ctx.scale(s,s);
    creature(tt,s,U,walk,phase,pulse);
    ctx.restore();
    var capx=cx-10*s,capy=gy-bob*s-100*s;
    if(pulse>0.2){burst(capx,capy,10*s*pulse,28*s*pulse,10,tt*2);ctx.fillStyle='rgba(216,255,114,0.85)';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();}
    // glowing spores
    for(i=0;i<60;i++){
      var age=tt-(12.4+i*0.1);
      if(age<0||age>3)continue;
      var vx=(frac(i*0.618)-0.35)*55*s,vy=-(35+frac(i*0.37)*45)*s;
      var spx=capx+vx*age*(1-0.1*age)+Math.sin(age*3+i)*8*s,spy=capy+vy*age+0.5*26*s*age*age;
      ctx.globalAlpha=1-age/3;
      ctx.beginPath();ctx.arc(spx,spy,(2.6+frac(i*0.7)*2.4)*Math.max(0.6,s/1.5),0,6.283);
      ctx.fillStyle='#d8ff72';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.3;ctx.stroke();
      ctx.globalAlpha=1;
    }
    // rain, stopped by the leaf umbrella
    if(wet>0.02){
      var lcx=cx,lcy=gy-bob*s-110*s,la=84*s,lb=17*s;
      ctx.strokeStyle='rgba(255,255,255,'+(0.8*wet)+')';ctx.lineCap='round';
      for(i=0;i<80;i++){
        var rx=frac(i*0.6180339)*W*1.1,ry=frac(i*0.37+tt*(1.4+(i%4)*0.2))*H*1.15-H*0.1,rl=H*(0.06+(i%3)*0.02);
        var ex=rx-rl*0.2,ey=ry+rl;
        if(U>0.5&&Math.abs(rx-lcx)<la){
          var top=lcy-0.8*lb*(1-Math.pow((rx-lcx)/la,2));
          if(ry>top)continue;
          if(ey>top){ey=top;ex=rx-(top-ry)*0.2;}
        }
        if(ry>=gy)continue;
        if(ey>gy){ey=gy;}
        ctx.lineWidth=1.6+(i%3)*0.5;
        ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(ex,ey);ctx.stroke();
        if(i%3===0&&(ey>=gy-0.5||ey<lcy+lb)){ctx.beginPath();ctx.arc(ex,ey,2.2,Math.PI,0);ctx.stroke();}
      }
      ctx.fillStyle='rgba(40,60,90,'+(wet*0.16)+')';ctx.fillRect(0,0,W,H);
    }

    // sound effects
    sfx('踏踏',cx-W*0.2,gy+H*0.1,base*0.7,-0.08+Math.sin(tt*6)*0.04,'#ffffff',popv(tt,1.2,5.2));
    sfx('啪嗒！',cx-W*0.02,H*0.3,base*1.3,0.1,'#ffe27a',popv(tt,6.2,8.6));
    sfx('哗啦啦',W*0.22,H*0.3,base*0.9,-0.08,'#ffffff',popv(tt,8.8,12));
    sfx('噗！',cx+W*0.03,H*0.24,base*1.5,-0.15,'#d8ff72',popv(tt,12.3,14.2));
    sfx('冒——',Math.min(W-base*1.5,cx+W*0.24),gy-H*0.14,base*0.9,0.1,'#ffffff',popv(tt,15,18));
    sfx('踏踏踏',W*0.3,gy+H*0.11,base*0.8,-0.05+Math.sin(tt*9)*0.04,'#ffffff',popv(tt,20.2,24));

    if(live){
      var fa=sm(24.2,25,tt);
      if(loops>0)fa=Math.max(fa,1-sm(0,0.6,tt));
      if(fa>0){ctx.fillStyle='rgba(19,32,26,'+fa+')';ctx.fillRect(0,0,W,H);}
    }
  }

  function draw(tt){ctx=mctx;scene(tt,true);}

  // ---- UI ----
  var elPlay=document.getElementById('play'),elSeek=document.getElementById('seek'),
      elClock=document.getElementById('clock'),elGauge=document.getElementById('gauge'),
      elName=document.getElementById('capName'),elText=document.getElementById('capText'),
      elCh=document.getElementById('chapters');
  var chBtns=[],thumbs=[];
  function fmt(v){var s=Math.floor(v);return '00:'+(s<10?'0':'')+s;}
  scenes.forEach(function(sc,idx){
    var b=document.createElement('button');b.type='button';
    b.innerHTML='<canvas aria-hidden="true"></canvas><span class="lab"><b>'+sc.name+'</b><small>'+fmt(sc.t)+'</small></span>';
    b.addEventListener('click',function(){t=sc.t;draw(t);ui();});
    elCh.appendChild(b);chBtns.push(b);thumbs.push(b.querySelector('canvas'));
  });
  function renderThumbs(){
    var sW=W,sH=H,sCtx=ctx;
    thumbs.forEach(function(el,n){
      var r=el.getBoundingClientRect();if(!r.width||!r.height)return;
      var d=Math.min(window.devicePixelRatio||1,2);
      el.width=Math.round(r.width*d);el.height=Math.round(r.height*d);
      var c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);
      W=r.width;H=r.height;ctx=c;
      scene(scenes[n].key,false);
    });
    W=sW;H=sH;ctx=sCtx;
  }
  function ui(){
    var idx=0;for(var i=0;i<scenes.length;i++)if(t>=scenes[i].t)idx=i;
    if(idx!==sceneIdx){
      sceneIdx=idx;
      elName.textContent=scenes[idx].name;elText.textContent=scenes[idx].text;
      chBtns.forEach(function(b,n){b.setAttribute('aria-current',n===idx?'true':'false');});
    }
    elSeek.value=t;
    elClock.textContent=fmt(t)+' / 00:25';
    var wet=sm(5.6,6.6,t)*(1-sm(16,18,t));
    elGauge.textContent='雨量 '+Math.round(wet*12)+' mm/h';
    elPlay.textContent=playing?'暂停':'播放';
  }
  elPlay.addEventListener('click',function(){playing=!playing;last=performance.now();ui();});
  elSeek.addEventListener('input',function(){t=parseFloat(elSeek.value);draw(t);ui();});

  function fit(){
    var r=cv.getBoundingClientRect();
    if(!r.width||!r.height)return;
    dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
    W=r.width;H=r.height;ctx=mctx;
    mctx.setTransform(dpr,0,0,dpr,0,0);
    draw(t);
    renderThumbs();
  }
  if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.load){
    document.fonts.load('900 40px "ZCOOL QingKe HuangYou"','踏啪嗒哗啦噗冒～！—').then(function(){fit();ui();}).catch(function(){});
  }

  function frame(now){
    var dt=Math.min(0.1,Math.max(0,(now-last)/1000));last=now;
    if(playing){
      t+=dt;
      if(t>=DUR){t-=DUR;loops++;}
      draw(t);ui();
    }
    requestAnimationFrame(frame);
  }
  fit();ui();
  last=performance.now();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
